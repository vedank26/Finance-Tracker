services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-tracker-app
    restart: unless-stopped
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:5000
      - --workers
      - "1"
      - --threads
      - "4"
      - --timeout
      - "120"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - run:app
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: 0
    ports:
      - "80:5000"
    volumes:
      - uploads_data:/app/uploads

volumes:
  uploads_data:
    name: finance-tracker-uploads-data
